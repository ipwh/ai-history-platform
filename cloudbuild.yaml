# Google Cloud Build：建置映像檔並部署到 Cloud Run
#
# 用法（在專案根目錄，先安裝並登入 gcloud）：
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-east2,_SERVICE=history-self-study,_REPOSITORY=history
#
# 需要的變數（可用 --substitutions 或觸發程序帶入；有預設值者可不填）：
#   _REGION        部署區域（預設 asia-east2，香港最近）
#   _SERVICE       Cloud Run 服務名稱
#   _REPOSITORY    Artifact Registry 倉庫名稱
#   _IMAGE_NAME    映像檔名稱（預設 hk-history-self-study）
#   _MAX_INSTANCES 最大執行個體數（SQLite 需要 1；改用 Cloud SQL 後可調高）
#   _ROSTER_SHEET_ID／_ROSTER_SHEET_NAME  學生名冊所在的 Google Sheet
#   _ROSTER_COLUMN_NAME  學生姓名取自名冊哪一欄（預設 CHNAME = 中文姓名）
#   _ROSTER_CLASS_PREFIXES  只開放的班別前綴（預設 1;2;3 = 中一至中三；留空 = 不設限）
#                           清單以分號分隔，避免與 gcloud 的逗號分隔衝突
# 「誰是教職員」政策（擁有者決定）：
#   allowlist（預設，最小權限）／school-domain（暫時的全校教職員政策，見上）
#   _STAFF_DOMAINS 只在 school-domain 時生效；應用程式未設定或拼錯時一律 fail-closed 回 allowlist
#   _ADMIN_EMAILS  管理員電郵（可進入 /admin；多個以分號分隔；留空 = 沒有人是管理員）
#                  注意：管理員必須在此指定，否則部署後無法進入管理員端。
#   _TEACHER_EMAILS 教師電郵（allowlist 政策下的教師；多個以分號分隔）
#   _REVIEWER_EMAILS 歷史科內容審核者（HISTORY_REVIEWER_EMAILS）：可核准 Golden fixture 及
#                  「已修復並核准」裁決的帳戶；多個以分號分隔。**平台 teacher／admin 角色不等於
#                  學科審核資格**，留空時所有學科裁決一律 fail-closed（回 403）。
#   _AUTH_FLAG     存取控制旗標：--allow-unauthenticated（預設）或留空（搭配 IAP／身分權杖）
#   _RUNTIME_SA    Cloud Run 執行身分（服務帳戶電郵；留空 = 專案預設的 Compute Engine 服務帳戶）
#   _BACKUP_BUCKET 資料庫備份的 Cloud Storage bucket（留空 = 不備份，重新部署後資料會遺失）
#   _BACKUP_PREFIX bucket 內的物件前置路徑（預設 history）
#   _BACKUP_INTERVAL_SECONDS 最長備份間隔秒數（預設 300）
#   _BACKUP_MIN_SPACING_SECONDS 資料有變更時的備份最短間隔秒數（預設 60）
#   _MATERIALS_SOURCE 教材所在的 GCS 前置路徑（例如 gs://專案-history-backup/materials/）；
#                   留空 = 使用工作目錄現有的 materials/（本機 gcloud builds submit 適用）。
#                   GitHub 觸發程序必須填入，否則工作目錄只有 materials/README.md。
#   _MIN_MATERIAL_FILES 同步教材後的最少檔案數（預設 1；0 = 容許無教材部署）
#   _QUALITY_GATE  1（預設）= 建置前先跑 npm run lint 及 npm test，失敗即中止
#
# 「推送即部署」（GitHub → Cloud Build → Cloud Run）以 scripts/setup-push-to-deploy.ps1
# 設定：它會把 materials/ 上載到私有 bucket、授權 Cloud Build 服務帳戶，並以線上服務
# 現有設定組成觸發程序，避免 substitutions 與正式環境漂移。
#
# 資料持久化（免費方案）：Cloud Run 的容器檔案系統不會保留資料，因此以 SQLite 快照
# （VACUUM INTO）+ Cloud Storage 備份，啟動時自動還原。bucket 由
# scripts/deploy-cloud-run.ps1 -Apply 建立，並只授權執行身分讀寫該 bucket。
#
# 敏感資料（AUTH_SECRET、LLM API key、Google OAuth 憑證、名冊服務帳戶 JSON）一律放在
# Secret Manager，以 --set-secrets 注入，不會出現在建置記錄或映像檔內。
# 這些 Secret 由 scripts/deploy-cloud-run.ps1 -Apply 建立（名稱見下方 _*_SECRET）。

substitutions:
  _REGION: asia-east2
  _SERVICE: history-self-study
  _REPOSITORY: history
  _IMAGE_NAME: hk-history-self-study
  _MAX_INSTANCES: "1"
  # 維持縮容至 0（不產生閒置執行個體的最低月費）。代價是冷啟動：SQLite 資料庫放在
  # /tmp，每個新執行個體都要由 Cloud Storage 還原約 34 MB 快照（2026-10-28 日誌：每日
  # 冷啟動 12–26 次），而冷啟動期間到達的請求會被 Cloud Run 中止
  # （`429 no available instance`），手機顯示 `Load failed`。
  # 保持 0 之下仍可運作的緩解措施：
  #   1. `--cpu-boost`（下方部署指令）：冷啟動期間給足 CPU，縮短「還原 34 MB」的等待；
  #   2. 備份已改為有限等待（最多 5 秒）並先 gzip，新執行個體的第一個請求不會再被
  #      備份拖住 5 分鐘（2026-10-29）；
  #   3. 若班際課堂時段仍見 `429`，可改為 1，或在該時段以 Cloud Scheduler 定期呼叫
  #      `/api/health` 保暖，毋須改動此處預設值。
  _MIN_INSTANCES: "0"
  _MEMORY: 1Gi
  _CPU: "1"
  _AUTH_FLAG: "--allow-unauthenticated"
  _RUNTIME_SA: ""
  _ROSTER_SHEET_ID: ""
  _ROSTER_SHEET_NAME: ""
  # 學生姓名取自名冊的哪一欄（此校名冊欄名為 CLASSCODE/CLASSNO/ENNAME/CHNAME/SEX/EMAIL）
  _ROSTER_COLUMN_NAME: "CHNAME"
  # 只開放的班別（前綴比對）；此平台為中一至中三，因此只接受 1x／2x／3x 班
  # 註：gcloud --set-env-vars 以逗號分隔多個變數，因此清單內用分號（設定層同時接受逗號、分號及空白）
  _ROSTER_CLASS_PREFIXES: "1;2;3;4;5;6"
  # 後台角色：管理員可進入 /admin（教材、OCR、課題發布、系統狀態）；教師可進入 /teacher
  # 註：清單內用分號，避免與 gcloud --set-env-vars 的逗號分隔衝突
  #
  # 註：校內網域本身不再授予教職員權限；預設（_STAFF_ACCESS_POLICY=allowlist）教師必須
  #     列在 _TEACHER_EMAILS，否則無法進入教師端。名冊內的帳戶一律是學生，不受此設定影響。
  #     若把 _STAFF_ACCESS_POLICY 設為 school-domain，_STAFF_DOMAINS 所列校內網域中
  #     「非學號形式」（^s\d+$ 除外的）帳戶全部會成為教師，可讀取全部學生的練習記錄
  #     ——這是擁有者明確授權的暫時「全校教職員」政策，不是最小權限政策。
  _ADMIN_EMAILS: ""
  _TEACHER_EMAILS: ""
  # 歷史科內容審核者名單（HISTORY_REVIEWER_EMAILS）：可核准 Golden fixture 及
  # 「已修復並核准」的學科裁決。留空 = 一律 fail-closed（平台角色不足以代表學科資格）。
  _REVIEWER_EMAILS: ""
  _STAFF_ACCESS_POLICY: "allowlist"
  _STAFF_DOMAINS: "pochiu.edu.hk"
  _BACKUP_BUCKET: ""
  _BACKUP_PREFIX: "history"
  _BACKUP_INTERVAL_SECONDS: "300"
  # 資料有變更時的備份最短間隔（秒）；令使用期間的資料遺失窗口更小
  _BACKUP_MIN_SPACING_SECONDS: "60"
  _AUTH_SECRET: history-auth-secret
  _LLM_SECRET: history-deepseek-api-key
  _ROSTER_SECRET: history-roster-service-account
  _GOOGLE_CLIENT_ID_SECRET: history-google-client-id
  _GOOGLE_CLIENT_SECRET_SECRET: history-google-client-secret
  # 教材來源（私有 bucket 內的前置路徑）。留空 = 使用工作目錄現有的 materials/
  # （本機 gcloud builds submit）；GitHub 觸發程序必須填入，否則映像檔不會有教材。
  _MATERIALS_SOURCE: ""
  # 同步教材後至少要有多少個教材檔（README.md 除外），否則中止建置（fail-closed）
  # 設為 0 等同容許無教材部署（管理員端會顯示教材缺失的警告）
  _MIN_MATERIAL_FILES: "1"
  # 1 = 建置映像檔前先跑 npm run lint 及 npm test，失敗即中止（不會部署）
  # 只在觸發程序（GitHub push）預設開啟；本機想快速部署可帶 _QUALITY_GATE=0
  _QUALITY_GATE: "1"

steps:
  # GitHub 觸發的建置若帶有問題的程式碼，品質閘門會在上載映像檔前就中止。
  # 註：測試使用合成教材，不依賴 materials/，因此這一步先於教材同步。
  - id: quality-gate
    name: node:24-bookworm-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_QUALITY_GATE}" != "1" ]; then
          echo "已略過品質閘門（_QUALITY_GATE=${_QUALITY_GATE}）"
          exit 0
        fi
        export NEXT_TELEMETRY_DISABLED=1
        npm ci --no-audit --no-fund
        npm run --silent lint
        npm test
    timeout: 1800s

  # materials/ 不納入版本控制（版權，見 .gitignore），由 GitHub 觸發時工作目錄只有
  # materials/README.md。這裡先由私有 bucket 同步回工作目錄，令 Dockerfile 的
  # `COPY ... /app/materials` 拿到完整教材；本機 gcloud builds submit 時
  # _MATERIALS_SOURCE 留空，直接使用本機的 materials/。
  - id: sync-materials
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # `$$` 會變成字面 `$`，交由 bash 展開
        SOURCE="${_MATERIALS_SOURCE}"
        MIN_FILES="${_MIN_MATERIAL_FILES}"
        # 以 bash 預設值補底：substitution 被覆寫成空字串時仍以 1 為下限
        MIN_FILES=$${MIN_FILES:-1}
        if [ -n "$$SOURCE" ]; then
          echo "由 $${SOURCE} 同步教材"
          rm -rf ./materials
          mkdir -p ./materials
          gcloud storage rsync --recursive "$${SOURCE%/}/" ./materials/
        else
          echo "未設定 _MATERIALS_SOURCE：沿用工作目錄現有的 materials/"
          mkdir -p ./materials
        fi
        COUNT=$$(find ./materials -type f ! -name README.md | wc -l)
        echo "教材檔案：$$COUNT 個（不含 README.md）"
        if [ "$$COUNT" -lt "$$MIN_FILES" ]; then
          echo "教材檔案不足（下限 $$MIN_FILES 個）：拒絕建置沒有教材的映像檔" >&2
          echo "請先執行 scripts/setup-push-to-deploy.ps1 上載教材，或帶 _MIN_MATERIAL_FILES=0 明確容許。" >&2
          exit 1
        fi

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}

  # 以 bash 執行，令 _AUTH_FLAG 可以留空（IAP 模式）而不會變成無效的空參數
  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # ${_...} 由 Cloud Build 取代；`$$` 會變成一個字面 `$`，交由 bash 處理，
        # 令 AUTH_FLAG／RUNTIME_SA 可以留空而不會產生無效參數
        AUTH_FLAG="${_AUTH_FLAG}"
        RUNTIME_SA="${_RUNTIME_SA}"
        BACKUP_BUCKET="${_BACKUP_BUCKET}"
        BACKUP_PREFIX="${_BACKUP_PREFIX}"
        BACKUP_INTERVAL_SECONDS="${_BACKUP_INTERVAL_SECONDS}"
        BACKUP_MIN_SPACING_SECONDS="${_BACKUP_MIN_SPACING_SECONDS}"
        gcloud run deploy "${_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID" \
          --region="${_REGION}" \
          --platform=managed \
          --port=8080 \
          --memory="${_MEMORY}" \
          --cpu="${_CPU}" \
          --min-instances="${_MIN_INSTANCES}" \
          --max-instances="${_MAX_INSTANCES}" \
          --cpu-boost \
          $$AUTH_FLAG \
          $${RUNTIME_SA:+--service-account=$$RUNTIME_SA} \
          --set-env-vars="NODE_ENV=production,LLM_PROVIDER=deepseek,LLM_MODEL=deepseek-flash,LLM_THINKING=disabled,LLM_MAX_TOKENS=8192,APP_DATABASE_PATH=/tmp/data/app.db,APP_UPLOADS_DIR=/tmp/data/uploads,OCR_CACHE_PATH=/tmp/data/ocr-cache,OCR_LANG_PATH=/app/ocr-lang,APP_MATERIALS_DIR=/app/materials,AUTH_REQUIRE_SIGN_IN=true,AUTH_SCHOOL_DOMAINS=pochiu.edu.hk,AUTH_ADMIN_EMAILS=${_ADMIN_EMAILS},AUTH_TEACHER_EMAILS=${_TEACHER_EMAILS},AUTH_STAFF_ACCESS_POLICY=${_STAFF_ACCESS_POLICY},AUTH_STAFF_DOMAINS=${_STAFF_DOMAINS},HISTORY_REVIEWER_EMAILS=${_REVIEWER_EMAILS},MATERIAL_AUTO_OPEN_POLICY=lesson-content,STUDENT_ROSTER_ENABLED=true,STUDENT_ROSTER_ENFORCE=true,STUDENT_ROSTER_SOURCE=sheets-api,STUDENT_ROSTER_SHEET_ID=${_ROSTER_SHEET_ID},STUDENT_ROSTER_SHEET_NAME=${_ROSTER_SHEET_NAME},STUDENT_ROSTER_COLUMN_NAME=${_ROSTER_COLUMN_NAME},STUDENT_ROSTER_CLASS_PREFIXES=${_ROSTER_CLASS_PREFIXES},DEMO_AUTO_PUBLISH_QUESTIONS=false,BACKUP_BUCKET=$${BACKUP_BUCKET},BACKUP_PREFIX=$${BACKUP_PREFIX},BACKUP_INTERVAL_SECONDS=$${BACKUP_INTERVAL_SECONDS},BACKUP_MIN_SPACING_SECONDS=$${BACKUP_MIN_SPACING_SECONDS},BACKUP_RESTORE_ON_START=true,BACKUP_PREFER_CLOUD=true" \
          --set-secrets="AUTH_SECRET=${_AUTH_SECRET}:latest,DEEPSEEK_API_KEY=${_LLM_SECRET}:latest,STUDENT_ROSTER_SERVICE_ACCOUNT_JSON=${_ROSTER_SECRET}:latest,GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID_SECRET}:latest,GOOGLE_CLIENT_SECRET=${_GOOGLE_CLIENT_SECRET_SECRET}:latest"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
